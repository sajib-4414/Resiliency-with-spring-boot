server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:orders_db;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 2000
            loggerLevel: FULL

inventory:
  url: http://localhost:8082

resilience4j:
  circuitbreaker:
    instances:
      inventory:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10                 # judge the last 10 calls (each retry attempt counts)
        minimumNumberOfCalls: 5               # no verdict before 5 calls are recorded
        failureRateThreshold: 50              # open at >= 50% failures
        slowCallDurationThreshold: 1500ms     # below the 2s read timeout, so slow-but-ok calls count
        slowCallRateThreshold: 50             # open at >= 50% slow calls
        waitDurationInOpenState: 10s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
        recordExceptions:                     # same transient failures retry handles
          - com.example.order.InventoryExceptions$InventoryUnavailableException
          - feign.RetryableException
        ignoreExceptions:                     # real answers: neither success nor failure
          - com.example.order.InventoryExceptions$UnknownSkuException
          - com.example.order.InventoryExceptions$InventoryRateLimitedException
  retry:
    instances:
      inventory:
        maxAttempts: 4                    # 1 call + 3 retries
        waitDuration: 500ms               # gaps: 0.5s, 1s, 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:                  # transient: 5xx, connection refused, timeouts
          - com.example.order.InventoryExceptions$InventoryUnavailableException
          - feign.RetryableException
        ignoreExceptions:                 # real answers: never retry
          - com.example.order.InventoryExceptions$UnknownSkuException
          - com.example.order.InventoryExceptions$InventoryRateLimitedException

  bulkhead:
    instances:
      inventory:
        maxConcurrentCalls: 5             # semaphore: at most 5 inventory calls in flight
        maxWaitDuration: 0                # no queueing: reject immediately when full

logging:
  level:
    com.example.order.InventoryClient: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,retries,retryevents,ratelimiters,bulkheads,metrics,prometheus
  health:
    circuitbreakers:
      enabled: true
