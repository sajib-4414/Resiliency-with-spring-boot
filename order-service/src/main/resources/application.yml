server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:orders_db;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 2000
            loggerLevel: FULL

inventory:
  url: http://localhost:8082

resilience4j:
  retry:
    instances:
      inventory:
        maxAttempts: 4                    # 1 call + 3 retries
        waitDuration: 500ms               # gaps: 0.5s, 1s, 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:                  # transient: 5xx, connection refused, timeouts
          - com.example.order.InventoryExceptions$InventoryUnavailableException
          - feign.RetryableException
        ignoreExceptions:                 # real answers: never retry
          - com.example.order.InventoryExceptions$UnknownSkuException
          - com.example.order.InventoryExceptions$InventoryRateLimitedException

logging:
  level:
    com.example.order.InventoryClient: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,retries,ratelimiters,bulkheads,metrics
  health:
    circuitbreakers:
      enabled: true
